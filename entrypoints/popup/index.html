<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slack Compose Tracker</title>
    <meta name="manifest.type" content="browser_action" />
  </head>
  <body>
    <main>
      <h1>今日の送信</h1>
      <dl>
        <dt>件数</dt>
        <dd id="count">-</dd>
        <dt>合計</dt>
        <dd id="total">-</dd>
        <dt>最長</dt>
        <dd id="longest">-</dd>
      </dl>
      <p class="actions">
        <button type="button" id="export-json">JSON 書き出し</button>
        <button type="button" id="export-csv">CSV 書き出し</button>
      </p>
      <p class="note" id="all-count"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
